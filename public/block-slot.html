<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>חסימת שעה ידנית</title>
<style>
  :root { --primary:#1B2A3A; --accent:#4ECDA0; --bg:#F6F4F0; --muted:#6b7280; --error:#c0392b; }
  * { box-sizing: border-box; }
  body { font-family: 'Assistant', 'Rubik', system-ui, sans-serif; background: var(--bg); color: var(--primary); margin: 0; padding: 24px 16px; }
  .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p.hint { color: var(--muted); font-size: .9rem; margin: 0 0 22px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
  .req { color: var(--error); margin-inline-start: 3px; }
  input, select { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit; background: #fff; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px; background: var(--accent); color: var(--primary); font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: .9rem; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.success { display: block; background: #e6f7f0; color: #1a7a4c; }
  .msg.error { display: block; background: #fdecea; color: var(--error); }
</style>
</head>
<body>
  <div class="card">
    <h1>חסימת שעה ידנית</h1>
    <p class="hint">סוגר חלון זמנים כדי שהמערכת לא תציע אותו ללקוחות. אפשר לחסום לספר ספציפי, או לבחור "כל הספרים".</p>
    <form id="blockForm">
      <label for="client_slug">קוד עסק <span class="req">*</span></label>
      <input type="text" id="client_slug" required autocomplete="off" placeholder="למשל salon-demo" />

      <label for="pin">קוד PIN <span class="req">*</span></label>
      <input type="text" id="pin" required autocomplete="off" inputmode="numeric" />

      <label for="date">תאריך <span class="req">*</span></label>
      <input type="date" id="date" required />

      <label for="start_time">משעה <span class="req">*</span></label>
      <input type="time" id="start_time" required />

      <label for="end_time">עד שעה <span class="req">*</span></label>
      <input type="time" id="end_time" required />

      <label for="staff_member">ספר <span class="req">*</span></label>
      <select id="staff_member" required>
        <option value="" disabled selected>בחר...</option>
        <option value="__all__">כל הספרים</option>
        <option value="דניאל שגיא">דניאל שגיא</option>
        <option value="מיכל בר">מיכל בר</option>
        <option value="שירן כהן">שירן כהן</option>
        <option value="איתי גולן">איתי גולן</option>
      </select>

      <label for="reason">סיבה (אופציונלי)</label>
      <input type="text" id="reason" autocomplete="off" placeholder="למשל: חופש" />

      <button type="submit" id="submitBtn">חסום שעה</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    var WEBHOOK_URL = 'https://rpya148.app.n8n.cloud/webhook/block-slot';
    var form = document.getElementById('blockForm');
    var msg = document.getElementById('msg');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';

      var staffValue = document.getElementById('staff_member').value;
      var body = {
        client_slug: document.getElementById('client_slug').value.trim(),
        pin: document.getElementById('pin').value.trim(),
        date: document.getElementById('date').value,
        start_time: document.getElementById('start_time').value,
        end_time: document.getElementById('end_time').value,
        staff_member: staffValue === '__all__' ? null : staffValue,
        reason: document.getElementById('reason').value.trim() || null,
      };

      fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .then(function (result) {
          if (result.ok) {
            msg.className = 'msg success';
            msg.textContent = 'השעה נחסמה בהצלחה.';
            form.reset();
          } else if (result.status === 403) {
            msg.className = 'msg error';
            msg.textContent = 'קוד PIN שגוי.';
          } else if (result.status === 404) {
            msg.className = 'msg error';
            msg.textContent = 'קוד עסק לא מוכר.';
          } else {
            msg.className = 'msg error';
            msg.textContent = 'שגיאה: ' + (result.data && result.data.error ? result.data.error : 'לא ידועה');
          }
        })
        .catch(function () {
          msg.className = 'msg error';
          msg.textContent = 'לא הצלחנו להתחבר לשרת. נסה שוב.';
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'חסום שעה';
        });
    });
  </script>
</body>
</html>
